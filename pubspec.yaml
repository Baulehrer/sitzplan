name: sitzplan
description: "Kaufi's Sitzplan-App für Lehrer — Sitzpläne erstellen, Schülerfotos zuordnen, als PDF exportieren."
publish_to: 'none'
version: 1.7.0+10

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  archive: ^4.0.9
  crypto: ^3.0.7
  provider: ^6.1.0
  sqflite: ^2.4.3
  sqflite_common_ffi: ^2.4.2+1
  sqlite3: ^3.5.2
  path_provider: ^2.1.6
  image_picker: ^1.2.3
  file_selector: ^1.0.0
  image: ^4.9.2
  pdf: ^3.13.0
  printing: ^5.15.0
  uuid: ^4.6.0
  path: ^1.9.0
  package_info_plus: ^10.2.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.0

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  adaptive_icon_background: "#009688"

flutter:
  uses-material-design: true
  fonts:
    - family: SitzplanDisplay
      fonts:
        - asset: assets/fonts/BarlowCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BarlowCondensed-Bold.ttf
          weight: 700
