name: Build & Release

on:
  workflow_dispatch:
  push:
    branches: ['main']
    tags: ['v*']

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.2
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.version.outputs.value }}
      app_build_number: ${{ steps.version.outputs.build_number }}
    steps:
      - uses: actions/checkout@v7
      - name: Read app version
        id: version
        run: |
          echo "value=$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)" >> "$GITHUB_OUTPUT"
          echo "build_number=$(sed -n 's/^version: [^+]*+\(.*\)/\1/p' pubspec.yaml)" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match pubspec version" >&2
            exit 1
          fi
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter test --dart-define=STORE_BUILD=true test/store_update_service_test.dart

  build-linux:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    needs: validate
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ${{ needs.validate.outputs.app_version }}
      APP_BUILD_NUMBER: ${{ needs.validate.outputs.app_build_number }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libblkid-dev liblzma-dev
      - run: flutter pub get
      - run: flutter build linux --release --build-name "$APP_VERSION" --build-number "$APP_BUILD_NUMBER"
      - name: Build AppImage
        run: packaging/linux/build_appimage.sh
      - uses: actions/upload-artifact@v7
        with:
          name: sitzplan-linux-appimage
          path: dist/Sitzplan-${{ env.APP_VERSION }}-x86_64.AppImage

  build-windows:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    needs: validate
    runs-on: windows-latest
    env:
      APP_VERSION: ${{ needs.validate.outputs.app_version }}
      APP_BUILD_NUMBER: ${{ needs.validate.outputs.app_build_number }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release --build-name "${{ env.APP_VERSION }}" --build-number "${{ env.APP_BUILD_NUMBER }}"
      - name: Bundle camera runtime
        shell: bash
        run: packaging/bundle_ffmpeg.sh build/windows/x64/runner/Release win32-x64 ffmpeg.exe
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build unsigned direct-download installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\windows\sitzplan.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed: $LASTEXITCODE" }
      - uses: actions/upload-artifact@v7
        with:
          name: sitzplan-windows-installer
          path: dist/Sitzplan-${{ env.APP_VERSION }}-Setup.exe
      - name: Build Store variant with Store-managed updates
        run: flutter build windows --release --dart-define=STORE_BUILD=true --build-name "${{ env.APP_VERSION }}" --build-number "${{ env.APP_BUILD_NUMBER }}"
      - name: Bundle Store camera runtime
        shell: bash
        run: packaging/bundle_ffmpeg.sh build/windows/x64/runner/Release win32-x64 ffmpeg.exe
      - name: Build and validate unsigned Store MSIX
        shell: pwsh
        run: packaging/windows/build_msix.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: sitzplan-windows-store
          path: dist/Sitzplan-${{ env.APP_VERSION }}-Store.msix

  build-macos:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    needs: validate
    runs-on: macos-15-intel
    env:
      APP_VERSION: ${{ needs.validate.outputs.app_version }}
      APP_BUILD_NUMBER: ${{ needs.validate.outputs.app_build_number }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release --build-name "$APP_VERSION" --build-number "$APP_BUILD_NUMBER"
      - name: Build DMG
        run: packaging/macos/create_dmg.sh
      - uses: actions/upload-artifact@v7
        with:
          name: sitzplan-macos-dmg
          path: dist/Sitzplan-${{ env.APP_VERSION }}-macos.dmg

  build-ios:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    needs: validate
    runs-on: macos-latest
    env:
      APP_VERSION: ${{ needs.validate.outputs.app_version }}
      APP_BUILD_NUMBER: ${{ needs.validate.outputs.app_build_number }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign
      - name: Package unsigned app
        run: |
          APP_PATH="build/ios/iphoneos/Runner.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "No iOS Runner.app bundle found" >&2
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$GITHUB_WORKSPACE/sitzplan-ios-unsigned.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: sitzplan-ios-unsigned
          path: sitzplan-ios-unsigned.zip

  build-android:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    needs: validate
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ${{ needs.validate.outputs.app_version }}
      APP_BUILD_NUMBER: ${{ needs.validate.outputs.app_build_number }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Configure stable Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ] || [ -z "$ANDROID_STORE_PASSWORD" ]; then
            echo "Android release signing secrets are required for update-compatible APKs." >&2
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sitzplan-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/sitzplan-release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_STORE_PASSWORD=$ANDROID_STORE_PASSWORD" >> "$GITHUB_ENV"
      - run: flutter build apk --release --build-name "$APP_VERSION" --build-number "$APP_BUILD_NUMBER"
      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk "Sitzplan-${APP_VERSION}-android.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: sitzplan-android
          path: Sitzplan-${{ env.APP_VERSION }}-android.apk

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [validate, build-linux, build-windows, build-macos, build-ios, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      APP_VERSION: ${{ needs.validate.outputs.app_version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Create SHA-256 checksums
        run: sha256sum Sitzplan-* sitzplan-ios-unsigned.zip > SHA256SUMS.txt
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            Sitzplan-*
            sitzplan-ios-unsigned.zip
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            Sitzplan-${{ env.APP_VERSION }}-x86_64.AppImage
            Sitzplan-${{ env.APP_VERSION }}-Setup.exe
            Sitzplan-${{ env.APP_VERSION }}-Store.msix
            Sitzplan-${{ env.APP_VERSION }}-macos.dmg
            sitzplan-ios-unsigned.zip
            Sitzplan-${{ env.APP_VERSION }}-android.apk
            SHA256SUMS.txt
